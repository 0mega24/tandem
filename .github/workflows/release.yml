# Release on a v* tag: `make check`, then goreleaser makes a DRAFT GitHub release with the
# archives, .deb, .rpm and pacman packages and checksums. A person reads it and publishes it.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never stop a release half way

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the draft release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # goreleaser reads the tags for the changelog
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
      - run: nix develop -c make check
      - run: nix develop -c make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
